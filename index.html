<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ねいろのダッシュ！</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyACV13o8mGiTP6m2wtvRPBG_wX2Xcbb-hI",
            authDomain: "neirogameanoban.firebaseapp.com",
            projectId: "neirogameanoban",
            storageBucket: "neirogameanoban.firebasestorage.app",
            messagingSenderId: "884708706267",
            appId: "1:884708706267:web:b9ffc17361554427aa89fe",
            measurementId: "G-303LBLLY8B"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const RANKING_COLLECTION = "neiro_dash_rankings";

        window.getRanking = async () => {
            try {
                const q = query(collection(db, RANKING_COLLECTION), orderBy("score", "asc"), limit(3));
                const snapshot = await getDocs(q);
                let result = [];
                snapshot.forEach(doc => result.push(doc.data()));
                return result;
            } catch (e) { return []; }
        };

        window.saveRanking = async (name, time) => {
            await addDoc(collection(db, RANKING_COLLECTION), { 
                name: name, score: parseFloat(time), createdAt: serverTimestamp() 
            });
        };
    </script>
    <style>body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; }</style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO, width: 800, height: 600,
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        physics: { default: 'arcade', arcade: { gravity: { y: 1400 }, debug: false } }, 
        scene: { preload: preload, create: create, update: update }
    };
    const game = new Phaser.Game(config);

    function preload() {
        this.load.image('title', 'title.png');
        this.load.image('run', 'Neiro1.png');
        this.load.image('jump', 'Neiro2.png');
        this.load.image('background', 'background.png');
        this.load.image('obs1', 'obstacles1.png');
        this.load.image('obs2', 'obstacles2.png');
        this.load.image('obs3', 'obstacles3.png');
        this.load.image('obs6', 'obstacles6.png');
        this.load.image('catSleep', 'obstacles4Cat.png');
        this.load.image('catAngry', 'obstacles5Cat.png');
        this.load.image('star', 'star.png');
        this.load.image('timer', 'timer.png');
        this.load.image('startButton', 'start.png');
        this.load.image('ytIcon', 'logo.png');
        this.load.audio('bgm', 'bgm1.mp3');
    }

    async function create() {
        this.add.image(400, 300, 'background');
        this.gameStarted = false;

        this.titleImage = this.add.image(400, 100, 'title').setScale(0.8);
        this.startBtn = this.add.image(400, 450, 'startButton').setInteractive();

        const ytIcon = this.add.image(60, 540, 'ytIcon').setScale(0.15).setInteractive();
        ytIcon.on('pointerdown', () => window.open('https://www.youtube.com/channel/UC9tdREypdhZQ9Hemq82r95Q', '_blank'));

        const rankings = await window.getRanking();
        let rankStr = "【ランキング TOP3】\n";
        rankings.forEach((r, i) => rankStr += `${i+1}位: ${r.name} - ${r.score}秒\n`);
        this.rankDisplay = this.add.text(400, 300, rankStr, { fontSize: '24px', fill: '#000', backgroundColor: '#fff', padding: 10 }).setOrigin(0.5);

        this.ctrlDisplay = this.add.text(780, 580, "【操作方法】\nスタート: エンターキー\nジャンプ: 上矢印キー / 画面タップ", { fontSize: '20px', fill: '#FF4500', align: 'right', fontStyle: 'bold', stroke: '#000000', strokeThickness: 4 }).setOrigin(1, 1);

        this.scoreText = this.add.text(16, 16, '回避: 0 / 10', { fontSize: '32px', fill: '#FFF' }).setVisible(false);
        this.timerText = this.add.text(780, 16, '0.00秒', { fontSize: '32px', fill: '#FFF' }).setOrigin(1, 0).setVisible(false);

        this.obstacles = this.physics.add.group();
        this.items = this.physics.add.group();
        this.catTraps = [];
        this.avoidCount = 0;

        this.player = this.physics.add.sprite(150, 400, 'run').setVisible(false);
        this.player.body.setAllowGravity(true);
        this.ground = this.physics.add.staticRectangle(400, 610, 800, 40);
        this.physics.add.collider(this.player, this.ground);
        this.physics.add.collider(this.player, this.obstacles, () => location.reload());

        const startGame = () => {
            if (this.gameStarted) return;
            this.gameStarted = true;
            this.startBtn.setVisible(false);
            this.rankDisplay.setVisible(false);
            this.ctrlDisplay.setVisible(false);
            this.titleImage.setVisible(false);
            ytIcon.setVisible(false);
            this.scoreText.setVisible(true);
            this.timerText.setVisible(true);
            this.player.setVisible(true).body.enable = true;
            this.startTime = this.time.now;
            this.bonusTime = 0;
            this.sound.play('bgm', { loop: true });
        };

        this.startBtn.on('pointerdown', startGame);
        this.input.keyboard.on('keydown-ENTER', startGame);
        this.input.on('pointerdown', (pointer) => {
            if (!this.gameStarted) startGame();
            else if (this.player.body.touching.down) this.player.setVelocityY(-900);
        });
        
        this.time.addEvent({ delay: 1500, callback: () => { if(this.gameStarted) spawnObstacle.call(this); }, loop: true });
        this.cursors = this.input.keyboard.createCursorKeys();
    }

    function spawnObstacle() {
        const rand = Math.random();
        if (rand < 0.3) {
            let cat = this.obstacles.create(900, 550, 'catSleep').setVelocityX(-750);
            cat.body.setAllowGravity(false);
            this.catTraps.push(cat);
        } else if (rand < 0.5) {
            this.items.create(900, 100, Math.random() < 0.5 ? 'star' : 'timer').setVelocityX(-750).body.setAllowGravity(false);
        } else {
            this.obstacles.create(900, 550, Phaser.Math.RND.pick(['obs1', 'obs2', 'obs3', 'obs6'])).setVelocityX(-750).body.setAllowGravity(false);
        }
    }

    function update() {
        if (!this.gameStarted) return;
        if (this.cursors.up.isDown && this.player.body.touching.down) this.player.setVelocityY(-900);
        this.player.setTexture(!this.player.body.touching.down ? 'jump' : 'run');
        
        this.obstacles.getChildren().forEach(obs => { 
            if (obs.x < -200) { obs.destroy(); this.avoidCount++; this.scoreText.setText('回避: ' + this.avoidCount + ' / 10'); } 
        });

        if (this.avoidCount >= 10 && this.gameStarted) {
            this.gameStarted = false;
            let finalTime = parseFloat(((this.time.now - this.startTime - (this.bonusTime || 0)) / 1000).toFixed(2));
            this.sound.stopAll();
            window.getRanking().then(rankings => {
                if (rankings.length < 3 || finalTime < rankings[2].score) {
                    const name = prompt("ランクイン！ " + finalTime + " 秒！お名前を入力してね！");
                    if (name) window.saveRanking(name, finalTime).then(() => location.reload());
                    else location.reload();
                } else {
                    alert("クリア！タイムは " + finalTime + " 秒でした！\nおしい！あとちょっとでランクインだったよ🐾 次はまた挑戦してね！");
                    location.reload();
                }
            });
        }
    }
</script>
</body>
</html>
