<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ねいろのダッシュ！</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyACV13o8mGiTP6m2wtvRPBG_wX2Xcbb-hI",
            authDomain: "neirogameanoban.firebaseapp.com",
            projectId: "neirogameanoban",
            storageBucket: "neirogameanoban.firebasestorage.app",
            messagingSenderId: "884708706267",
            appId: "1:884708706267:web:b9ffc17361554427aa89fe",
            measurementId: "G-303LBLLY8B"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const RANKING_COLLECTION = "neiro_dash_rankings";

        window.getRanking = async () => {
            const q = query(collection(db, RANKING_COLLECTION), orderBy("score", "asc"), limit(3));
            const snapshot = await getDocs(q);
            let result = [];
            snapshot.forEach(doc => result.push(doc.data()));
            return result;
        };

        window.saveRanking = async (name, time) => {
            const q = query(collection(db, RANKING_COLLECTION), orderBy("score", "asc"), limit(3));
            const snapshot = await getDocs(q);
            let scores = [];
            snapshot.forEach(doc => scores.push(doc.data().score));

            if (scores.length < 3 || time < scores[2]) {
                await addDoc(collection(db, RANKING_COLLECTION), { 
                    name: name, score: parseFloat(time), createdAt: serverTimestamp() 
                });
                alert("おめでとう！ランキング入りしました！");
            } else {
                alert("タイム: " + time + " 秒！今回はランク外でした…");
            }
        };
    </script>
    <style>body { margin: 0; overflow: hidden; }</style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO, width: 800, height: 600,
        physics: { default: 'arcade', arcade: { gravity: { y: 1400 }, debug: false } }, 
        scene: { preload: preload, create: create, update: update }
    };
    const game = new Phaser.Game(config);

    function preload() {
        this.load.image('run', 'Neiro1.png');
        this.load.image('jump', 'Neiro2.png');
        this.load.image('background', 'background.png');
        this.load.image('obs1', 'obstacles1.png');
        this.load.image('obs2', 'obstacles2.png');
        this.load.image('obs3', 'obstacles3.png');
        this.load.image('obs6', 'obstacles6.png');
        this.load.image('catSleep', 'obstacles4Cat.png');
        this.load.image('catAngry', 'obstacles5Cat.png');
        this.load.image('star', 'star.png');
        this.load.image('timer', 'timer.png');
        this.load.image('startButton', 'start.png');
        // ★パスをシンプルにしました。これで動かない場合はファイルの場所を確認してね！
        this.load.image('ytIcon', 'logo.jpg');
        this.load.audio('bgm', 'bgm1.mp3');
    }

    async function create() {
        this.add.image(400, 300, 'background');
        
        // --- ランキング表示 ---
        const rankings = await window.getRanking();
        let rankText = "【ランキング TOP3】\n";
        rankings.forEach((r, i) => rankText += `${i+1}位: ${r.name} - ${r.score}秒\n`);
        this.add.text(500, 50, rankText, { fontSize: '20px', fill: '#000', backgroundColor: '#fff', padding: 10 });

        this.gameStarted = false;
        this.player = this.physics.add.sprite(150, 400, 'run').setVisible(false);
        this.player.body.enable = false;

        this.ground = this.physics.add.staticGroup().create(400, 610, null).setSize(800, 40).setVisible(false);
        this.physics.add.collider(this.player, this.ground);

        const startGame = () => {
            if (this.gameStarted) return;
            this.startBtn.setVisible(false);
            this.ytIcon.setVisible(false);
            this.player.setVisible(true).body.enable = true;
            this.gameStarted = true;
            this.startTime = this.time.now;
            if (!this.sound.get('bgm')) this.sound.play('bgm', { loop: true });
        };

        this.startBtn = this.add.image(400, 350, 'startButton').setInteractive().on('pointerdown', startGame);
        this.ytIcon = this.add.image(400, 450, 'ytIcon').setInteractive().setScale(0.2).on('pointerdown', () => window.open('https://www.youtube.com/channel/UC9tdREypdhZQ9Hemq82r95Q', '_blank'));

        this.input.keyboard.on('keydown-ENTER', startGame);
        this.obstacles = this.physics.add.group();
        this.items = this.physics.add.group();
        this.physics.add.collider(this.player, this.obstacles, () => { this.sound.stopAll(); this.scene.restart(); });
        this.scoreText = this.add.text(16, 16, '回避: 0 / 10', { fontSize: '32px', fill: '#FFF' });
        this.catTraps = [];
        this.avoidCount = 0;
        this.bonusTime = 0;
        this.time.addEvent({ delay: 1500, callback: spawnObstacle, callbackScope: this, loop: true });
        this.cursors = this.input.keyboard.createCursorKeys();
    }

    function spawnObstacle() {
        if (!this.gameStarted) return;
        const rand = Math.random();
        if (rand < 0.3) {
            let cat = this.obstacles.create(900, 550, 'catSleep').setVelocityX(-750);
            cat.body.setAllowGravity(false).setSize(cat.width * 0.6, cat.height * 0.6);
            this.catTraps.push(cat);
        } else if (rand < 0.5) {
            this.items.create(900, 100, Math.random() < 0.5 ? 'star' : 'timer').setVelocityX(-750).body.setAllowGravity(false);
        } else {
            this.obstacles.create(900, 550, Phaser.Math.RND.pick(['obs1', 'obs2', 'obs3', 'obs6'])).setVelocityX(-750).body.setAllowGravity(false).setSize(50, 50);
        }
    }

    function update() {
        if (!this.gameStarted) return;
        this.player.setTexture(!this.player.body.touching.down ? 'jump' : 'run');
        if (this.cursors.up.isDown && this.player.body.touching.down) this.player.setVelocityY(-900);
        
        this.obstacles.getChildren().forEach(obs => { if (obs.x < -200) { obs.destroy(); this.avoidCount++; this.scoreText.setText('回避: ' + this.avoidCount + ' / 10'); } });

        if (this.avoidCount >= 10 && this.gameStarted) {
            this.gameStarted = false;
            let finalTime = ((this.time.now - this.startTime - this.bonusTime) / 1000).toFixed(2);
            this.sound.stopAll();
            const name = prompt("クリア！ " + finalTime + " 秒！お名前を入力してね！");
            if (name) window.saveRanking(name, finalTime).then(() => this.scene.restart());
            else this.scene.restart();
        }
    }
</script>
</body>
</html>
