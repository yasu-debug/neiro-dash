<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ねいろのダッシュ！</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyACV13o8mGiTP6m2wtvRPBG_wX2Xcbb-hI",
            authDomain: "neirogameanoban.firebaseapp.com",
            projectId: "neirogameanoban",
            storageBucket: "neirogameanoban.firebasestorage.app",
            messagingSenderId: "884708706267",
            appId: "1:884708706267:web:b9ffc17361554427aa89fe",
            measurementId: "G-303LBLLY8B"
        };
        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.RANKING_COLLECTION = "neiro_dash_rankings";
    </script>
    <style>body { margin: 0; }</style>
</head>
<body>
<script>
    // ★ランキング保存用の関数
    async function checkAndSaveScore(name, time) {
        const q = query(collection(window.db, window.RANKING_COLLECTION), orderBy("score", "asc"), limit(3));
        const snapshot = await getDocs(q);
        let scores = [];
        snapshot.forEach(doc => scores.push(doc.data().score));

        if (scores.length < 3 || time < scores[2]) {
            await addDoc(collection(window.db, window.RANKING_COLLECTION), { 
                name: name, score: time, createdAt: serverTimestamp() 
            });
            alert("ランキング入り！おめでとう！");
        } else {
            alert("タイム: " + time + " 秒。トップ3には届きませんでした…");
        }
    }

    const config = {
        type: Phaser.AUTO,
        width: 800, height: 600,
        physics: { default: 'arcade', arcade: { gravity: { y: 1400 }, debug: false } }, 
        scene: { preload: preload, create: create, update: update }
    };
    const game = new Phaser.Game(config);

    // （preload, create, update等の関数はそのまま...）
    // ※以下、update関数内の終了処理のみ変更します
    
    // ... (前略: preload, create, spawnObstacleはそのまま) ...

    function update(time) {
        if (!this.gameStarted) return;

        this.player.setTexture(!this.player.body.touching.down ? 'jump' : 'run');
        if (this.cursors.up.isDown && this.player.body.touching.down) this.player.setVelocityY(-900);
        
        // ... (catTrapsや障害物の処理はそのまま) ...
        
        this.obstacles.getChildren().forEach(obs => {
            if (obs.x < -200) {
                obs.destroy();
                this.avoidCount++;
                this.scoreText.setText('回避: ' + this.avoidCount + ' / 10');
            }
        });

        // ★終了時の処理をランキング対応に修正
        if (this.avoidCount >= 10 && this.gameStarted) {
            this.gameStarted = false; // 二重発動防止
            let finalTime = ((this.time.now - this.startTime - this.bonusTime) / 1000).toFixed(2);
            this.sound.stopAll();
            
            const name = prompt("クリア！ " + finalTime + " 秒でした！お名前を入力してね！");
            if (name) {
                checkAndSaveScore(name, parseFloat(finalTime)).then(() => this.scene.restart());
            } else {
                this.scene.restart();
            }
        }
    }
</script>
</body>
</html>
