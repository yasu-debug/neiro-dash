<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ねいろのダッシュ！</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>body { margin: 0; }</style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO,
        width: 800, height: 600,
        physics: { 
            default: 'arcade', 
            arcade: { gravity: { y: 1200 }, debug: false } 
        }, 
        scene: { preload: preload, create: create, update: update }
    };
    const game = new Phaser.Game(config);

    function preload() {
        this.load.image('run', 'Neiro1.png');
        this.load.image('jump', 'Neiro2.png');
        this.load.image('background', 'background.png');
        this.load.image('obs1', 'obstacles1.png');
        this.load.image('obs2', 'obstacles2.png');
        this.load.image('obs3', 'obstacles3.png');
        this.load.image('obs6', 'obstacles6.png');
        this.load.image('catSleep', 'obstacles4Cat.png');
        this.load.image('catAngry', 'obstacles5Cat.png');
    }

    function create() {
        this.add.image(400, 300, 'background');

        this.ground = this.physics.add.staticGroup();
        this.ground.create(400, 610, null).setSize(800, 40).setVisible(false);

        this.player = this.physics.add.sprite(150, 400, 'run');
        this.player.setCollideWorldBounds(true);
        this.physics.add.collider(this.player, this.ground);

        this.obstacles = this.physics.add.group();
        this.physics.add.collider(this.player, this.obstacles, () => {
            this.scene.restart();
        });

        this.catTraps = [];

        this.time.addEvent({
            delay: 1500,
            callback: spawnObstacle,
            callbackScope: this,
            loop: true
        });

        this.cursors = this.input.keyboard.createCursorKeys();
    }

    function spawnObstacle() {
        // スピードを -600 に強化
        const speed = -600; 

        if (Math.random() < 0.33) {
            let cat = this.obstacles.create(900, 550, 'catSleep');
            cat.setVelocityX(speed);
            cat.body.setAllowGravity(false);
            cat.body.setSize(cat.width * 0.5, cat.height * 0.7);
            this.catTraps.push(cat);
        } else {
            const obsList = ['obs1', 'obs2', 'obs3', 'obs6'];
            let key = Phaser.Math.RND.pick(obsList);
            let obs = this.obstacles.create(900, 550, key);
            obs.setVelocityX(speed); 
            obs.body.setAllowGravity(false);
            obs.body.setSize(obs.width * 0.5, obs.height * 0.7);
            obs.body.setOffset(obs.width * 0.25, obs.height * 0.15);
        }
    }

    function update() {
        if (!this.player.body.touching.down) {
            this.player.setTexture('jump');
        } else {
            this.player.setTexture('run');
        }

        if (this.cursors.up.isDown && this.player.body.touching.down) {
            this.player.setVelocityY(-1200); 
        }

        // 猫トラップの「右側で発動」処理
        // 猫トラップの処理部分をこれに置き換えてください
    this.catTraps.forEach((cat) => {
        // X=700（画面右側）に来たら発動！
        if (cat.active && cat.x < 700 && cat.texture.key === 'catSleep') {
            cat.setTexture('catAngry');
            cat.body.setAllowGravity(false);
            
            // 1. まず垂直に上にだけ飛ばす（X速度は0にする）
            cat.setVelocityX(0);
            cat.setVelocityY(-1800); // 垂直上昇スピードを強化！
            
            // 2. 0.3秒後に左へ猛スピードで飛ばす
            this.time.delayedCall(300, () => {
                if (cat.active) {
                    cat.setVelocityY(0);    // 上昇を止める
                    cat.setVelocityX(-1000); // 左へ爆速移動！
                }
            });
            
            cat.setCollideWorldBounds(false);
        }
    });

        this.obstacles.getChildren().forEach(obs => {
            if (obs.x < -200) obs.destroy();
        });
    }
</script>
</body>
</html>
