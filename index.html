<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ねいろのダッシュ！</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyACV13o8mGiTP6m2wtvRPBG_wX2Xcbb-hI",
            authDomain: "neirogameanoban.firebaseapp.com",
            projectId: "neirogameanoban",
            storageBucket: "neirogameanoban.firebasestorage.app",
            messagingSenderId: "884708706267",
            appId: "1:884708706267:web:b9ffc17361554427aa89fe",
            measurementId: "G-303LBLLY8B"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const RANKING_COLLECTION = "neiro_dash_rankings";

        window.saveRanking = async (name, time) => {
            const q = query(collection(db, RANKING_COLLECTION), orderBy("score", "asc"), limit(3));
            const snapshot = await getDocs(q);
            let scores = [];
            snapshot.forEach(doc => scores.push(doc.data().score));

            if (scores.length < 3 || time < scores[2]) {
                await addDoc(collection(db, RANKING_COLLECTION), { 
                    name: name, score: parseFloat(time), createdAt: serverTimestamp() 
                });
                alert("おめでとう！ランキング入りしました！");
            } else {
                alert("タイム: " + time + " 秒！トップ3には届きませんでした…");
            }
        };
    </script>
    <style>body { margin: 0; }</style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO,
        width: 800, height: 600,
        physics: { default: 'arcade', arcade: { gravity: { y: 1400 }, debug: false } }, 
        scene: { preload: preload, create: create, update: update }
    };
    const game = new Phaser.Game(config);

    function preload() {
        this.load.image('run', 'Neiro1.png');
        this.load.image('jump', 'Neiro2.png');
        this.load.image('background', 'background.png');
        this.load.image('obs1', 'obstacles1.png');
        this.load.image('obs2', 'obstacles2.png');
        this.load.image('obs3', 'obstacles3.png');
        this.load.image('obs6', 'obstacles6.png');
        this.load.image('catSleep', 'obstacles4Cat.png');
        this.load.image('catAngry', 'obstacles5Cat.png');
        this.load.image('star', 'star.png');
        this.load.image('timer', 'timer.png');
        this.load.image('startButton', 'start.png');
        this.load.image('ytIcon', 'logo.jpg');
        this.load.audio('bgm', 'bgm1.mp3');
    }

    function create() {
        this.add.image(400, 300, 'background');
        this.gameStarted = false;

        this.player = this.physics.add.sprite(150, 400, 'run');
        this.player.setCollideWorldBounds(true);
        this.player.setVisible(false);
        this.player.body.enable = false;

        this.ground = this.physics.add.staticGroup();
        this.ground.create(400, 610, null).setSize(800, 40).setVisible(false);
        this.physics.add.collider(this.player, this.ground);

        const startGame = () => {
            if (this.gameStarted) return;
            this.startBtn.setVisible(false);
            this.ytIcon.setVisible(false);
            this.player.setVisible(true);
            this.player.body.enable = true;
            this.player.body.setSize(this.player.width * 0.7, this.player.height * 0.8);
            this.gameStarted = true;
            this.startTime = this.time.now;
            if (!this.sound.get('bgm') || !this.sound.get('bgm').isPlaying) {
                this.sound.play('bgm', { loop: true });
            }
        };

        this.startBtn = this.add.image(400, 350, 'startButton').setInteractive();
        this.startBtn.on('pointerdown', startGame);

        this.ytIcon = this.add.image(400, 450, 'ytIcon').setInteractive().setScale(0.2);
        this.ytIcon.on('pointerdown', () => window.open('https://www.youtube.com/channel/UC9tdREypdhZQ9Hemq82r95Q', '_blank'));

        this.input.keyboard.on('keydown-ENTER', startGame);

        this.obstacles = this.physics.add.group();
        this.items = this.physics.add.group();
        this.physics.add.collider(this.player, this.obstacles, () => {
            this.sound.stopAll();
            this.scene.restart();
        });
        
        this.physics.add.overlap(this.player, this.items, (player, item) => {
            if (item.texture.key === 'star') this.avoidCount += 2;
            else if (item.texture.key === 'timer') this.bonusTime += 2000;
            item.destroy();
            this.scoreText.setText('回避: ' + this.avoidCount + ' / 10');
        }, null, this);
        
        this.scoreText = this.add.text(16, 16, '回避: 0 / 10', { fontSize: '32px', fill: '#FFF' });
        this.catTraps = [];
        this.avoidCount = 0;
        this.bonusTime = 0;
        
        this.time.addEvent({ delay: 1500, callback: spawnObstacle, callbackScope: this, loop: true });
        this.cursors = this.input.keyboard.createCursorKeys();
    }

    function spawnObstacle() {
        if (!this.gameStarted) return;
        const speed = -750;
        const rand = Math.random();
        if (rand < 0.3) { 
            let cat = this.obstacles.create(900, 550, 'catSleep');
            cat.setVelocityX(speed);
            cat.body.setAllowGravity(false);
            cat.body.setSize(cat.width * 0.6, cat.height * 0.6);
            this.catTraps.push(cat);
        } else if (rand < 0.5) {
            let item = this.items.create(900, 100, Math.random() < 0.5 ? 'star' : 'timer');
            item.setVelocityX(speed);
            item.body.setAllowGravity(false);
        } else {
            let obs = this.obstacles.create(900, 550, Phaser.Math.RND.pick(['obs1', 'obs2', 'obs3', 'obs6']));
            obs.setVelocityX(speed);
            obs.body.setAllowGravity(false);
            obs.body.setSize(obs.width * 0.6, obs.height * 0.6);
        }
    }

    function update(time) {
        if (!this.gameStarted) return;
        this.player.setTexture(!this.player.body.touching.down ? 'jump' : 'run');
        if (this.cursors.up.isDown && this.player.body.touching.down) this.player.setVelocityY(-900);
        
        this.catTraps.forEach(cat => {
            if (cat.active && cat.x < 700 && cat.texture.key === 'catSleep') {
                cat.setTexture('catAngry');
                cat.setVelocityY(-1500); 
                this.time.delayedCall(300, () => { if(cat.active) { cat.setVelocityY(0); cat.setVelocityX(-800); }});
            }
        });

        this.obstacles.getChildren().forEach(obs => {
            if (obs.x < -200) { obs.destroy(); this.avoidCount++; this.scoreText.setText('回避: ' + this.avoidCount + ' / 10'); }
        });

        if (this.avoidCount >= 10 && this.gameStarted) {
            this.gameStarted = false;
            let finalTime = ((this.time.now - this.startTime - this.bonusTime) / 1000).toFixed(2);
            this.sound.stopAll();
            const name = prompt("クリア！ " + finalTime + " 秒！お名前を入力してね！");
            if (name) {
                window.saveRanking(name, finalTime).then(() => this.scene.restart());
            } else {
                this.scene.restart();
            }
        }
    }
</script>
</body>
</html>
