<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>テスト用画面</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO,
        width: 800, height: 600,
        physics: { default: 'arcade', arcade: { gravity: { y: 800 } } },
        scene: { create: create }
    };
    new Phaser.Game(config);

    function create() {
        // 画像を使わず、赤い四角形をプレイヤーとして表示します
        this.player = this.add.rectangle(400, 300, 50, 50, 0xff0000);
        this.physics.add.existing(this.player);
        this.player.body.setCollideWorldBounds(true);
        
        // 地面（青い四角形）
        let ground = this.add.rectangle(400, 580, 800, 40, 0x0000ff);
        this.physics.add.existing(ground, true);
        this.physics.add.collider(this.player, ground);
        
        // メッセージを表示
        this.add.text(10, 10, '赤と青の四角形が見えたら、Phaserは正常です！', { fill: '#ffffff' });
    }
</script>
</body>
</html>
