<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ねいろのダッシュ！</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>body { margin: 0; }</style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO,
        width: 800, height: 600,
        physics: { default: 'arcade', arcade: { gravity: { y: 500 }, debug: false } }, 
        scene: { preload: preload, create: create, update: update }
    };
    const game = new Phaser.Game(config);

    function preload() {
        this.load.image('run', 'Neiro1.png');
        this.load.image('jump', 'Neiro2.png');
        this.load.image('background', 'background.png');
        this.load.image('obs1', 'obstacles1.png');
        this.load.image('obs2', 'obstacles2.png');
        this.load.image('obs3', 'obstacles3.png');
        this.load.image('obs6', 'obstacles6.png');
        this.load.image('catSleep', 'obstacles4Cat.png');
        this.load.image('catAngry', 'obstacles5Cat.png');
        this.load.image('star', 'star.png');
        this.load.image('timer', 'timer.png');
    }

    function create() {
        this.add.image(400, 300, 'background');
        this.ground = this.physics.add.staticGroup();
        this.ground.create(400, 610, null).setSize(800, 40).setVisible(false);

        this.player = this.physics.add.sprite(150, 400, 'run');
        this.player.setCollideWorldBounds(true);
        this.physics.add.collider(this.player, this.ground);

        this.obstacles = this.physics.add.group();
        this.items = this.physics.add.group();
        
        this.physics.add.collider(this.player, this.obstacles, () => {
            this.consecutiveAvoids = 0;
            this.scene.restart();
        });
        
        this.physics.add.overlap(this.player, this.items, (player, item) => {
            if (item.texture.key === 'star') {
                this.avoidCount += 2;
                this.consecutiveAvoids = 0;
            } else if (item.texture.key === 'timer') {
                this.bonusTime += 2000;
                this.consecutiveAvoids = 0;
            }
            item.destroy();
            this.scoreText.setText('回避: ' + this.avoidCount + ' / 10');
        });

        this.avoidCount = 0;
        this.consecutiveAvoids = 0;
        this.startTime = this.time.now;
        this.bonusTime = 0;
        this.scoreText = this.add.text(16, 16, '回避: 0 / 10', { fontSize: '32px', fill: '#FFF' });

        this.catTraps = [];
        this.itemsMoving = [];

        this.time.addEvent({ delay: 1500, callback: spawnObstacle, callbackScope: this, loop: true });
        this.cursors = this.input.keyboard.createCursorKeys();
    }

    function spawnObstacle() {
        const rand = Math.random();
        
        // --- 条件分岐で出現を制限 ---
        if (rand < 0.3) { // 猫トラップ
            let cat = this.obstacles.create(900, 550, 'catSleep');
            cat.setVelocityX(-800);
            cat.body.setAllowGravity(false);
            this.catTraps.push(cat);
        } else if (rand < 0.45) { // アイテム出現
            let isStar = Math.random() < 0.5;
            // タイマーは制限なし、スターは回避6以上で出現
            if (isStar && this.consecutiveAvoids < 6) return; 

            let item = this.items.create(900, 100, isStar ? 'star' : 'timer');
            // スターだけスピードを半分(-400)にする
            item.setVelocityX(isStar ? -400 : -800);
            item.body.setAllowGravity(false);
            this.itemsMoving.push(item);
        } else { // 通常障害物
            let obs = this.obstacles.create(900, 550, Phaser.Math.RND.pick(['obs1', 'obs2', 'obs3', 'obs6']));
            obs.setVelocityX(-800);
            obs.body.setAllowGravity(false);
        }
    }

    function update() {
        this.player.setTexture(!this.player.body.touching.down ? 'jump' : 'run');
        if (this.cursors.up.isDown && this.player.body.touching.down) this.player.setVelocityY(-1200);

        // スターの落下処理
        this.itemsMoving.forEach(i => {
            if(i.active && i.texture.key === 'star' && i.x < 420 && i.x > 380 && i.y < 200) {
                i.y = 450; // 下に瞬間移動
                i.setVelocityY(0); // 落下後は水平移動を維持
            }
        });

        // 猫処理
        this.catTraps.forEach(cat => {
            if (cat.active && cat.x < 700 && cat.texture.key === 'catSleep') {
                cat.setTexture('catAngry');
                cat.setVelocityY(-1800);
                this.time.delayedCall(300, () => { if(cat.active) { cat.setVelocityY(0); cat.setVelocityX(-1000); }});
            }
        });

        this.obstacles.getChildren().forEach(obs => {
            if (obs.x < -200) {
                obs.destroy();
                this.avoidCount++;
                this.consecutiveAvoids++;
                this.scoreText.setText('回避: ' + this.avoidCount + ' / 10');
            }
        });

        if (this.avoidCount >= 10) {
            let finalTime = ((this.time.now - this.startTime - this.bonusTime) / 1000).toFixed(2);
            alert("クリア！タイム: " + finalTime + " 秒");
            this.scene.restart();
        }
    }
</script>
</body>
</html>
