<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ねいろのダッシュ！</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>body { margin: 0; }</style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO,
        width: 800, height: 600,
        physics: { default: 'arcade', arcade: { gravity: { y: 1400 }, debug: false } }, 
        scene: { preload: preload, create: create, update: update }
    };
    const game = new Phaser.Game(config);

    function preload() {
        this.load.image('run', 'Neiro1.png');
        this.load.image('jump', 'Neiro2.png');
        this.load.image('background', 'background.png');
        this.load.image('obs1', 'obstacles1.png');
        this.load.image('obs2', 'obstacles2.png');
        this.load.image('obs3', 'obstacles3.png');
        this.load.image('obs6', 'obstacles6.png');
        this.load.image('catSleep', 'obstacles4Cat.png');
        this.load.image('catAngry', 'obstacles5Cat.png');
        this.load.image('star', 'star.png');
        this.load.image('timer', 'timer.png');
        this.load.image('startButton', 'start.png');
    }

    function create() {
        this.add.image(400, 300, 'background');
        this.gameStarted = false;

        // --- スタート画面の配置 ---
        // 二人のねいろちゃん
        this.neiro1 = this.add.image(200, 500, 'run');
        this.neiro2 = this.add.image(600, 500, 'run');
        
        // スターの位置にスタートボタンを配置
        this.startBtn = this.physics.add.sprite(400, 150, 'startButton').setInteractive();
        this.startBtn.body.setAllowGravity(false);
        this.startBtn.setImmovable(true);

        // --- ゲーム本体 ---
        this.ground = this.physics.add.staticGroup();
        this.ground.create(400, 610, null).setSize(800, 40).setVisible(false);

        this.player = this.physics.add.sprite(150, 400, 'run');
        this.player.setCollideWorldBounds(true);
        this.player.body.setSize(this.player.width * 0.7, this.player.height * 0.8);
        this.physics.add.collider(this.player, this.ground);

        // ボタンとの衝突判定（触れたらスタート）
        this.physics.add.collider(this.player, this.startBtn, () => {
            if(!this.gameStarted) {
                this.gameStarted = true;
                this.startBtn.destroy();
                this.neiro1.destroy();
                this.neiro2.destroy();
                this.startTime = this.time.now;
            }
        });

        this.obstacles = this.physics.add.group();
        this.items = this.physics.add.group();
        this.physics.add.collider(this.player, this.obstacles, () => this.scene.restart());
        
        this.avoidCount = 0;
        this.scoreText = this.add.text(16, 16, '', { fontSize: '32px', fill: '#FFF' });
        this.catTraps = [];
        this.time.addEvent({ delay: 1500, callback: spawnObstacle, callbackScope: this, loop: true });
        this.cursors = this.input.keyboard.createCursorKeys();
    }

    function spawnObstacle() {
        if (!this.gameStarted) return;
        // ... (省略: 前回のspawnObstacleの内容をそのまま使用してください)
    }

    function update(time) {
        if (!this.gameStarted) {
            // 二人のねいろちゃんをふわふわさせる
            this.neiro1.y = 500 + Math.sin(time / 300) * 20;
            this.neiro2.y = 500 + Math.cos(time / 300) * 20;
            return;
        }

        this.scoreText.setText('回避: ' + this.avoidCount + ' / 10');
        this.player.setTexture(!this.player.body.touching.down ? 'jump' : 'run');
        if (this.cursors.up.isDown && this.player.body.touching.down) this.player.setVelocityY(-900);
        // ... (省略: 前回のupdateの内容をそのまま使用してください)
    }
</script>
</body>
</html>
