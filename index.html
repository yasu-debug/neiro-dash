<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ねいろのダッシュ！</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>body { margin: 0; }</style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO,
        width: 800, height: 600,
        physics: { default: 'arcade', arcade: { gravity: { y: 800 } } },
        scene: { preload: preload, create: create, update: update }
    };
    const game = new Phaser.Game(config);

    function preload() {
        // もし画像ファイル名にスペースや全角文字が含まれているとエラーになります。
        // ファイル名はすべて小文字の半角英数であることを確認してくださいね。
        this.load.image('run', 'Neiro1.png');
        this.load.image('jump', 'Neiro2.png');
        this.load.image('background', 'background.png');
    }

    function create() {
        // 1. 背景 (まずは背景だけ表示されるか試します)
        this.add.image(400, 300, 'background');

        // 2. 地面
        this.platforms = this.physics.add.staticGroup();
        let ground = this.add.rectangle(400, 580, 800, 40, 0xffffff, 0); 
        this.physics.add.existing(ground, true);
        this.platforms.add(ground);

        // 3. プレイヤー
        this.player = this.physics.add.sprite(400, 300, 'run');
        this.player.setCollideWorldBounds(true);
        this.player.setBounce(0.2);
        this.physics.add.collider(this.player, this.platforms);

        this.cursors = this.input.keyboard.createCursorKeys();
    }

    function update() {
        if (!this.player.body.touching.down) {
            this.player.setTexture('jump');
        } else {
            this.player.setTexture('run');
        }

        if (this.cursors.left.isDown) this.player.setVelocityX(-200);
        else if (this.cursors.right.isDown) this.player.setVelocityX(200);
        else this.player.setVelocityX(0);

        if (this.cursors.up.isDown && this.player.body.touching.down) this.player.setVelocityY(-500);
    }
</script>
</body>
</html>
