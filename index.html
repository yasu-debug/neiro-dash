<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ねいろのダッシュ！</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>body { margin: 0; }</style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO,
        width: 800, height: 600,
        physics: { default: 'arcade', arcade: { gravity: { y: 800 }, debug: false } }, 
        scene: { preload: preload, create: create, update: update }
    };
    const game = new Phaser.Game(config);

    function preload() {
        this.load.image('run', 'Neiro1.png');
        this.load.image('jump', 'Neiro2.png');
        this.load.image('background', 'background.png');
        // 障害物の読み込み
        this.load.image('obs1', 'obstacles1.png');
        this.load.image('obs2', 'obstacles2.png');
        this.load.image('obs3', 'obstacles3.png');
        this.load.image('obs6', 'obstacles6.png');
    }

    function create() {
        this.add.image(400, 300, 'background');

        this.platforms = this.physics.add.staticGroup();
        let ground = this.add.rectangle(400, 580, 800, 40, 0x000000, 0); 
        this.physics.add.existing(ground, true);
        this.platforms.add(ground);

        this.player = this.physics.add.sprite(100, 450, 'run');
        this.player.setCollideWorldBounds(true);
        this.physics.add.collider(this.player, this.platforms);

        // 障害物を管理するグループ
        this.obstacles = this.physics.add.group();
        
        // プレイヤーと障害物がぶつかったらゲームオーバー（今回は停止するだけ）
        this.physics.add.collider(this.player, this.obstacles, () => {
            this.scene.pause(); // ぶつかったらゲームを止める
            alert("ぶつかっちゃった！");
        });

        // 障害物を定期的に出すタイマー（2秒ごとに発生）
        this.time.addEvent({
            delay: 2000,
            callback: spawnObstacle,
            callbackScope: this,
            loop: true
        });

        this.cursors = this.input.keyboard.createCursorKeys();
    }

    function spawnObstacle() {
        // 4種類の画像からランダムに選ぶ
        const obsList = ['obs1', 'obs2', 'obs3', 'obs6'];
        const randomObs = Phaser.Math.RND.pick(obsList);
        
        // 画面右端から出現
        let obs = this.obstacles.create(850, 530, randomObs);
        obs.setVelocityX(-300); // 左へ流れるスピード
        obs.setCollideWorldBounds(false);
    }

    function update() {
        if (!this.player.body.touching.down) this.player.setTexture('jump');
        else this.player.setTexture('run');

        if (this.cursors.up.isDown && this.player.body.touching.down) {
            this.player.setVelocityY(-500);
        }
    }
</script>
</body>
</html>
