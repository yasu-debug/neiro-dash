<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ねいろのダッシュ！</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>body { margin: 0; }</style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO,
        width: 800, height: 600,
        physics: { 
            default: 'arcade', 
            arcade: { gravity: { y: 1000 }, debug: false } // 重力を少し強くしました
        }, 
        scene: { preload: preload, create: create, update: update }
    };
    const game = new Phaser.Game(config);

    function preload() {
        this.load.image('run', 'Neiro1.png');
        this.load.image('jump', 'Neiro2.png');
        this.load.image('background', 'background.png');
        this.load.image('obs1', 'obstacles1.png');
        this.load.image('obs2', 'obstacles2.png');
        this.load.image('obs3', 'obstacles3.png');
        this.load.image('obs6', 'obstacles6.png');
    }

    function create() {
        // 背景を表示
        this.add.image(400, 300, 'background');

        // 地面：透明な壁を作ってプレイヤーを支えます
        this.ground = this.physics.add.staticGroup();
        this.ground.create(400, 580, null).setSize(800, 40).setVisible(false);

        // プレイヤー
        this.player = this.physics.add.sprite(150, 450, 'run');
        this.player.setCollideWorldBounds(true);
        this.physics.add.collider(this.player, this.ground);

        // 障害物グループ
        this.obstacles = this.physics.add.group();
        this.physics.add.collider(this.obstacles, this.ground); // 障害物も地面に乗せる
        
        // プレイヤーと障害物がぶつかったらゲームオーバー
        this.physics.add.overlap(this.player, this.obstacles, () => {
            this.scene.restart(); // ぶつかったらリスタート！
        });

        // 障害物を生成するタイマー
        this.time.addEvent({
            delay: 1500,
            callback: () => {
                const obsList = ['obs1', 'obs2', 'obs3', 'obs6'];
                const key = Phaser.Math.RND.pick(obsList);
                let obs = this.obstacles.create(850, 500, key);
                obs.setVelocityX(-400); // 左へ移動
                obs.body.setAllowGravity(false); // 障害物は重力の影響を受けないようにする
            },
            loop: true
        });

        this.cursors = this.input.keyboard.createCursorKeys();
    }

    function update() {
        // ジャンプ中か走っているかの画像切り替え
        if (!this.player.body.touching.down) {
            this.player.setTexture('jump');
        } else {
            this.player.setTexture('run');
        }

        // ジャンプの処理
        if (this.cursors.up.isDown && this.player.body.touching.down) {
            this.player.setVelocityY(-600);
        }
    }
</script>
</body>
</html>
